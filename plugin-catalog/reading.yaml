description: "Newsletters out of the Gmail inbox, into a reader in Anakot Desktop (a page in the sidebar) and on your phone (dashboard web app). Setup scans the inbox and suggests the newsletters; native Gmail filters then move the senders you pick into one label, even when Anakot is off. Read with j/k, dark or original colors per sender, unsubscribe in one tap, add or remove senders by hand, and ask Anakot about any issue (a new chat with the issue attached, or the @newsletter: reference in any chat). `anakot reading export` feeds digest cron jobs. Disclosure: uses your own Google OAuth client, declared under oauth: and signed in with `anakot auth add reading:google` (Anakot stores and refreshes the token; the plugin never holds it); calls only the Gmail API through credentialed_provider_request, plus, when you press Unsubscribe, a one-click POST to the sender's List-Unsubscribe URL (public https hosts only) or an unsubscribe email from your account; changes Gmail only to create its label, write and delete its own filters, move routed senders' mail out of the inbox, mark opened emails read and trash emails you delete; `anakot reading setup` runs `anakot config set` and `anakot auth add` in your terminal (without YOLO or auto-approve variables); writes only its own ANAKOT_HOME/reading folder; @newsletter: and Ask Anakot send the newsletter text to your model provider; no telemetry."
