description: >-
  Deterministic local guardrails for Anakot and dev workflows. Three invocable
  tools—git-diff secret scanning, a destructive-command firewall, and a project
  health score—plus native Anakot surfaces: additive credential-redaction
  patterns, a soloknuckle:hygiene skill, anakot hygiene CLI, /hygiene, and a
  weekly hygiene-report blueprint. One rule set, same verdicts across
  CLI/hooks/MCP/Anakot. No hooks, no middleware, no prompt rewriting, no
  telemetry.
