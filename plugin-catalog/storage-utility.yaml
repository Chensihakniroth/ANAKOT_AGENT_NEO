title: Tune-up
description: "Keep Anakot fast, healthy and tidy from one Desktop panel. Clean up sorts the Anakot home into Safe to clean, Take a quick look and Kept safe on purpose, with plain-language answers to what is it, is it safe and can I undo; it reviews exact items before anything happens and reports the measured space recovered. It runs the maintenance Anakot ships but few people find (sessions prune with preview, pm gc, uv cache prune, checkpoints, worktree prune, session-database packing), finds folders Anakot created elsewhere from its own session history, and moves reviewable items to a restorable 30-day Trash. Checkup explains down or crash-looping Anakot services and stops leftover agent processes; Explore shows a size map with folder descriptions and duplicate finding; optional consented AI explanation via its own auxiliary task. Disclosure — Linux/systemd only; no network except an optional, consented AI explanation (folder totals and counts only) through Anakot's routing; reads home metadata, tool caches, session history, /proc process and open-file info, systemd unit settings, journal lines, crontab and git ls-files (never .env, auth.json, env files, start scripts or /proc/<pid>/environ); on user confirmation it permanently deletes chosen files in Anakot-created project folders and ~/.cache, ~/.npm and ~/.pnpm-store tool caches, moves other items to a restorable 30-day Trash, runs allow-listed anakot/uv/pnpm/git maintenance plus journalctl --vacuum-size and apt-get clean when root, starts/restarts/stops/disables Anakot systemd services, can write a Restart=always drop-in and enable the disk-cleanup plugin, sends SIGTERM to selected leftover processes, and briefly stops Anakot services to pack state.db; non-Anakot child processes get only PATH, HOME and locale."
