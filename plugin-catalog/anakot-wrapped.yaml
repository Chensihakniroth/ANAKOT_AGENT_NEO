description: "Your week with Anakot as a 30-second video, delivered every Sunday: what your agent did, what it cost, and how much of your time went into upkeep versus Anakot working for you. Built from Anakot's own session records by code: no model calls, no tokens, secrets and home paths stripped. Disclosure — reads your Anakot session history (read-only) to build the video, runs a pinned `npx hyperframes@0.8.217` renderer that downloads a headless Chrome on first use, and `anakot wrapped schedule` adds a weekly cron job that delivers the video to your chosen chat with `anakot send`."
title: Anakot Wrapped
