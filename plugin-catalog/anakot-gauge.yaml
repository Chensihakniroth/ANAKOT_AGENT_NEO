name: anakot-gauge
repo: https://github.com/SidelightAi/anakot-gauge
sha: 38bb1937b2ea9cf48816ed65015bb7efc69ad24c
description: "Context gauge — a live ring/dash showing how full your agent's context window is, per session and topic, with a desktop plugin and tools (gauge_check, gauge_report, gauge_set_window, gauge_render, gauge_action). Runs fully local: no API key, no telemetry. Disclosure — reads Anakot' state.db (read-only) for session titles and scans the memories folders (including other profiles' when run from the default profile) for size metrics; `gauge_action` lets the agent queue `/compact` and `/new` in the current session when you answer a gauge alert; with `alerts.route` set to `home` or `custom:` it runs `anakot send` to deliver alerts to that chat, and `/gauge audit` runs `anakot doctor`."
maintainer: SidelightAi
tier: community
category: desktop
docs_url: https://github.com/SidelightAi/anakot-gauge
version: "0.6.2"
image: https://raw.githubusercontent.com/SidelightAi/anakot-gauge/38bb1937b2ea9cf48816ed65015bb7efc69ad24c/assets/banner.png
