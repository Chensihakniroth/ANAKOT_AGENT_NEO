# Secret-scanning exclusions.
#
# Upstream ships dummy credentials inside its own test fixtures and docs: a fake Google key in
# tests/fakes/providers/gemini_native.py, a fake OpenAI key in the sessions-export test, weak
# Telegram tokens in the credential-guard tests, and an example key in the gif-search skill doc.
# GitHub opens an alert for each, and push protection blocks a push that repeats one — for values
# that are not real secrets. A regenerate from upstream restores these files verbatim, so the same
# alerts come back every cycle.
#
# Excluding them closes those alerts and keeps them out of push protection (GitHub docs, "Excluding
# folders and files from secret scanning"). Deliberately file-scoped, never `tests/**`: a real
# credential committed in a test file is still caught. Review this list when a regenerate brings new
# fixture files; an entry for a path upstream no longer ships is harmless.
paths-ignore:
  # Open alerts on the snapshot import (238ab19e) — still dummy values in today's tree.
  - "tests/fakes/providers/gemini_native.py"
  - "tests/anakot_cli/test_sessions_export_md_cli.py"
  - "tests/gateway/test_weak_credential_guard.py"
  # Open alerts on upstream-era commits, whose pre-rebrand paths renamed to these.
  - "tests/anakot_cli/test_env_sanitize_on_load.py"
  - "tests/anakot_cli/test_approvals_suggest.py"
  - "optional-skills/media/gif-search/SKILL.md"
  # Upstream-era paths absent from this tree today; listed so a regenerate that restores
  # them does not re-open the same alerts.
  - "tests/gateway/test_session_handoff_owner.py"
  - "tests/e2e/core/platforms/test_telegram_bot_api_base_url.py"
  - "evals/terminal-bench-2/evaluate_config.yaml"